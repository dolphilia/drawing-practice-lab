<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380"><rect width="1000" height="380" fill="white"/><g font-family="Hiragino Kaku Gothic ProN, sans-serif" fill="#254b5b"><rect x="15" y="30" width="970" height="95" fill="#f0f6f6" stroke="#c5d9df" stroke-width="3"/><text x="35" y="68" font-size="30" fill="#187f7b">A</text><text x="100" y="68" font-size="24" fill="#254b5b">見ながら描く</text><text x="100" y="103" font-size="18" fill="#77929d">手本を表示したまま</text><text x="475" y="82" font-size="22" fill="#254b5b">見えている形を写せるか</text><rect x="15" y="145" width="970" height="95" fill="#f0f6f6" stroke="#c5d9df" stroke-width="3"/><text x="35" y="183" font-size="30" fill="#187f7b">B</text><text x="100" y="183" font-size="24" fill="#254b5b">閉じて同じ図を描く</text><text x="100" y="218" font-size="18" fill="#77929d">観察後は手本も前の絵も隠す</text><text x="475" y="197" font-size="22" fill="#254b5b">見た配置を思い出せるか</text><rect x="15" y="260" width="970" height="95" fill="#f0f6f6" stroke="#c5d9df" stroke-width="3"/><text x="35" y="298" font-size="30" fill="#187f7b">C</text><text x="100" y="298" font-size="24" fill="#254b5b">別の向きから描く</text><text x="100" y="333" font-size="18" fill="#77929d">寸法は見てよい／完成図は隠す</text><text x="475" y="312" font-size="22" fill="#254b5b">同じ立体を別視点へ組み立てられるか</text></g></svg>