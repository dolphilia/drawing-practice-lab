<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465"><rect width="1000" height="465" fill="white"/><g font-family="Hiragino Kaku Gothic ProN, sans-serif" fill="#254b5b"><text x="40" y="34" font-size="24" fill="#254b5b">部分練習で決めたこと</text><text x="535" y="34" font-size="24" fill="#254b5b">別のポーズの小さな作品で使う</text><polygon points="90,157 200,157 240,122 130,122" fill="#f4f8fa" stroke="#254b5b" stroke-width="3"/><rect x="90" y="157" width="110" height="145" fill="#e3f0f5" stroke="#254b5b" stroke-width="3"/><polygon points="200,157 240,122 240,267 200,302" fill="#d0e5eb" stroke="#254b5b" stroke-width="3"/><line x1="223" y1="202" x2="303" y2="277" stroke="#187f7b" stroke-width="17"/><line x1="223" y1="202" x2="303" y2="277" stroke="#b9ddd6" stroke-width="11"/><circle cx="223" cy="202" r="10" fill="#187f7b"/><circle cx="223" cy="202" r="5" fill="#b65d36"/><polygon points="610,167 720,167 760,132 650,132" fill="#f4f8fa" stroke="#254b5b" stroke-width="3"/><rect x="610" y="167" width="110" height="145" fill="#e3f0f5" stroke="#254b5b" stroke-width="3"/><polygon points="720,167 760,132 760,277 720,312" fill="#d0e5eb" stroke="#254b5b" stroke-width="3"/><line x1="743" y1="212" x2="823" y2="142" stroke="#187f7b" stroke-width="17"/><line x1="743" y1="212" x2="823" y2="142" stroke="#b9ddd6" stroke-width="11"/><circle cx="743" cy="212" r="10" fill="#187f7b"/><circle cx="743" cy="212" r="5" fill="#b65d36"/><rect x="632" y="60" width="67" height="56" fill="#f4f8fa" stroke="#254b5b" stroke-width="3"/><circle cx="653" cy="87" r="4" fill="#254b5b"/><circle cx="680" cy="87" r="4" fill="#254b5b"/><line x1="662" y1="116" x2="662" y2="132" stroke="#254b5b" stroke-width="8"/><line x1="635" y1="312" x2="635" y2="372" stroke="#254b5b" stroke-width="12"/><line x1="694" y1="312" x2="694" y2="372" stroke="#254b5b" stroke-width="12"/><text x="38" y="398" font-size="22" fill="#254b5b">「腕の付け根は胴体の側面に置く」</text><text x="515" y="398" font-size="22" fill="#254b5b">腕を上げても、付け根の