<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410"><rect width="1000" height="410" fill="white"/><g font-family="Hiragino Kaku Gothic ProN, sans-serif" fill="#254b5b"><text x="35" y="32" font-size="22" fill="#254b5b">① 外形の線</text><path d="M 90 95 C 90 57 240 57 240 95 L 240 295 C 240 333 90 333 90 295 Z" stroke="#254b5b" stroke-width="3" fill="#e3f0f5"/><path d="M 90 95 C 90 133 240 133 240 95" stroke="#254b5b" stroke-width="2" fill="none"/><text x="35" y="375" font-size="19" fill="#254b5b">画面上で物の外側を区切る</text><text x="365" y="32" font-size="22" fill="#254b5b">② 向きを示す補助線</text><path d="M 420 95 C 420 57 570 57 570 95 L 570 295 C 570 333 420 333 420 295 Z" stroke="#254b5b" stroke-width="3" fill="#e3f0f5"/><path d="M 420 95 C 420 133 570 133 570 95" stroke="#254b5b" stroke-width="2" fill="none"/><line x1="495" y1="58" x2="495" y2="335" stroke="#187f7b" stroke-width="4" stroke-dasharray="8 6"/><text x="365" y="375" font-size="19" fill="#254b5b">筒の中心の通り道を決める</text><text x="695" y="32" font-size="22" fill="#254b5b">③ 曲面の回り込みの補助線</text><path d="M 750 95 C 750 57 900 57 900 95 L 900 295 C 900 333 750 333 750 295 Z" stroke="#254b5b" stroke-width="3" fill="#e3f0f5"/><path d="M 750 95 C 750 133 900 133 900 95" stroke="#254b5b" stroke-width="2" fill="none"/><path d="M 750 205 C 750 243 900 243 900 205" stroke="#b65d36" stroke-width="4" fill="none"/><path d="M 750 205 C 750 167 900 167 900 205" stroke="#b65d36" stroke-width="2" fill="none" stroke-dasharray="8 6"/><text x="695" y="375" font-size="19" fill="#254b5b">途中の断面を考える</text><text x="24" y="406" font-size="19" fill="#77929d">②③は形を考えるための線。完成画で全部を残す必要はない。</text></g></svg>