idth="3"/><line x1="735" y1="275" x2="875" y2="275" stroke="#187f7b" stroke-width="2" stroke-dasharray="8 6"/><line x1="735" y1="315" x2="875" y2="315" stroke="#187f7b" stroke-width="2" stroke-dasharray="8 6"/><text x="888" y="262" font-size="20" fill="#187f7b">1</text><text x="888" y="302" font-size="20" fill="#187f7b">2</text><text x="888" y="342" font-size="20" fill="#187f7b">3</text><text x="715" y="401" font-size="21" fill="#254b5b">下は10×3=30mm</text><text x="35" y="446" font-size="20" fill="#77929d">説明用の寸法。描画中に定規で正解を作るのではなく、描いた後に比を確かめる。</text></g></svg>