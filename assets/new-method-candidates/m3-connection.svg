<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="425" viewBox="0 0 1000 425"><rect width="1000" height="425" fill="white"/><g font-family="Hiragino Kaku Gothic ProN, sans-serif" fill="#254b5b"><text x="35" y="34" font-size="24" fill="#254b5b">① 付け根が離れた例</text><polygon points="100,123 210,123 250,88 140,88" fill="#f4f8fa" stroke="#254b5b" stroke-width="3"/><rect x="100" y="123" width="110" height="145" fill="#e3f0f5" stroke="#254b5b" stroke-width="3"/><polygon points="210,123 250,88 250,233 210,268" fill="#d0e5eb" stroke="#254b5b" stroke-width="3"/><line x1="268" y1="168" x2="348" y2="243" stroke="#187f7b" stroke-width="17"/><line x1="268" y1="168" x2="348" y2="243" stroke="#b9ddd6" stroke-width="11"/><circle cx="268" cy="168" r="10" fill="#187f7b"/><circle cx="233" cy="168" r="5" fill="#b65d36"/><line x1="233" y1="168" x2="268" y2="168" stroke="#b65d36" stroke-width="2" stroke-dasharray="8 6"/><text x="35" y="342" font-size="22" fill="#b65d36">ここに隙間がある</text><text x="525" y="34" font-size="24" fill="#254b5b">② 付け根を側面に置く例</text><polygon points="590,123 700,123 740,88 630,88" fill="#f4f8fa" stroke="#254b5b" stroke-width="3"/><rect x="590" y="123" width="110" height="145" fill="#e3f0f5" stroke="#254b5b" stroke-width="3"/><polygon points="700,123 740,88 740,233 700,268" fill="#d0e5eb" stroke="#254b5b" stroke-width="3"/><line x1="723" y1="168" x2="803" y2="243" stroke="#187f7b" stroke-width="17"/><line x1="723" y1="168" x2="803" y2="243" stroke="#b9ddd6" stroke-width="11"/><circle cx="723" cy="168" r="10" fill="#187f7b"/><circle cx="723" cy="168" r="5" fill="#b65d36"/><text x="525" y="342" font-size="22" fill="#187f7b">付け根をこの点へ置く</text><text x="25" y="397" font-size="18" fill="#77929d">今回の設計は「棒が箱の側面に付く」。赤点は設計上の接続位置。人体の肩関節の位置ではない。</text></g></svg>