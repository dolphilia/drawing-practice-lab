<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<title id="title">同じ「二つの箱」でも、表しているものが違う</title><desc id="desc">原典をもとにした独自の説明図 ｜ 人体の実測値・採点用の正解画像ではありません</desc>
<rect width="100%" height="100%" fill="#f6f8fa"/>
<g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif">
<text x="44" y="54" font-size="32" fill="#243747" font-weight="700">同じ「二つの箱」でも、表しているものが違う</text><text x="44" y="90" font-size="19" fill="#243747" font-weight="400">原典をもとにした独自の説明図 ｜ 人体の実測値・採点用の正解画像ではありません</text>
<rect x="32" y="122" width="672" height="562" rx="16" fill="white" stroke="#dce3e9"/><rect x="736" y="122" width="672" height="562" rx="16" fill="white" stroke="#dce3e9"/><text x="58" y="163" font-size="26" fill="#243747" font-weight="700">洞田式：中立配置の初期ブロック</text><text x="762" y="163" font-size="26" fill="#243747" font-weight="700">Robo Bean：中立配置の二つの量</text><polyline points="244.06,535.90 399.94,559.20" fill="none" stroke="#91651b" stroke-width="1.6" stroke-dasharray="5 5"/><polyline points="244.06,535.90 184.06,562.80" fill="none" stroke="#91651b" stroke-width="1.6" stroke-dasharray="5 5"/><polyline points="244.06,535.90 244.06,405.50" fill="none" stroke="#91651b" stroke-width="1.6" stroke-dasharray="5 5"/><polygon points="399.94,559.20 339.94,586.10 339.94,455.70 399.94,428.80" fill="#e8c784" fill-opacity="0.9" stroke="#91651b" stroke-width="2.5" stroke-linejoin="round"/><polygon points="184.06,562.80 339.94,586.10 339.94,455.70 184.06,432.40" fill="#fff0cd" fill-opacity="0.9" stroke="#91651b" stroke-width="2.5" stroke-linejoin="round"/><polygon points="244.06,405.50 399.94,428.80 339.94,455.70 184.06,432.40" fill="#fff7e5" fill-opacity="0.9" stroke="#91651b" stroke-width="2.5" stroke-linejoin="round"/><polyline points="244.06,405.50 399.94,428.80" fill="none" stroke="#245b82" stroke-width="1.6" stroke-dasharray="5 5"/><polyline points="244.06,405.50 184.06,432.40" fill="none" stroke="#245b82" stroke-width="1.6" stroke-dasharray="5 5"/><polyline points="244.06,405.50 244.06,231.64" fill="none" stroke="#245b82" stroke-width="1.6" stroke-dasharray="5 5"/><polygon points="399.94,428.80 339.94,455.70 339.94,281.83 399.94,254.93" fill="#b8d6ed" fill-opacity="0.9" stroke="#245b82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="184.06,432.40 339.94,455.70 339.94,281.83 184.06,258.54" fill="#e2effa" fill-opacity="0.9" stroke="#245b82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="244.06,231.64 399.94,254.93 339.94,281.83 184.06,258.54" fill="#f2f8fc" fill-opacity="0.9" stroke="#245b82" stroke-width="2.5" stroke-linejoin="round"/><polyline points="923.01,537.09 1094.49,562.72" fill="none" stroke="#91651b" stroke-width="1.6" stroke-dasharray="5 5"/><polyline points="923.01,537.09 873.51,559.28" fill="none" stroke="#91651b" stroke-width="1.6" stroke-dasharray="5 5"/><polyline points="923.01,537.09 923.01,432.77" fill="none" stroke="#91651b" stroke-width="1.6" stroke-dasharray="5 5"/><polygon points="1094.49,562.72 1044.99,584.91 1044.99,480.59 1094.49,458.40" fill="#e8c784" fill-opacity="0.9" stroke="#91651b" stroke-width="2.5" stroke-linejoin="round"/><polygon points="873.51,559.28 1044.99,584.91 1044.99,480.59 873.51,454.96" fill="#fff0cd" fill-opacity="0.9" stroke="#91651b" stroke-width="2.5" stroke-linejoin="round"/><polygon points="923.01,432.77 1094.49,458.40 1044.99,480.59 873.51,454.96" fill="#fff7e5" fill-opacity="0.9" stroke="#91651b" stroke-width="2.5" stroke-linejoin="round"/><polyline points="933.06,380.77 1088.94,404.06" fill="none" stroke="#245b82" stroke-width="1.6" stroke-dasharray="5 5"/><polyline points="933.06,380.77 879.06,404.98" fill="none" stroke="#245b82" stroke-width="1.6" stroke-dasharray="5 5"/><polyline points="933.06,380.77 933.06,206.90" fill="none" stroke="#245b82" stroke-width="1.6" stroke-dasharray="5 5"/><polygon points="1088.94,404.06 1034.94,428.27 1034.94,254.40 1088.94,230.20" fill="#b8d6ed" fill-opacity="0.9" stroke="#245b82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="879.06,404.98 1034.94,428.27 1034.94,254.40 879.06,231.11" fill="#e2effa" fill-opacity="0.9" stroke="#245b82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="933.06,206.90 1088.94,230.20 1034.94,254.40 879.06,231.11" fill="#f2f8fc" fill-opacity="0.9" stroke="#245b82" stroke-width="2.5" stroke-linejoin="round"/><text x="446" y="277" font-size="22" fill="#245b82" font-weight="400">胸郭の基準箱</text><text x="446" y="310" font-size="20" fill="#243747" font-weight="400">高さ H</text><text x="446" y="348" font-size="20" fill="#243747" font-weight="400">奥行き 2H/3</text><text x="446" y="478" font-size="20" fill="#91651b" font-weight="400">下へ延ばす補助箱</text><text x="446" y="509" font-size="20" fill="#243747" font-weight="400">高さ 3H/4</text><text x="446" y="545" font-size="17" fill="#243747" font-weight="400">骨盤そのものではない</text><text x="1124" y="268" font-size="20" fill="#245b82" font-weight="400">胸郭＋肩の一部</text><text x="1124" y="451" font-size="19" fill="#243747" font-weight="400">箱の間に接続部</text><text x="1124" y="526" font-size="20" fill="#91651b" font-weight="400">骨盤＋臀部</text><text x="58" y="616" font-size="19" fill="#243747" font-weight="400">胸の面取り等を省き、基準箱と補助箱の関係を示す。</text><text x="58" y="649" font-size="19" fill="#243747" font-weight="400">この図は完成した洞田式素体を表していない。</text><text x="762" y="616" font-size="19" fill="#243747" font-weight="400">箱の角を骨の目印に対応させ、面で向きを表す。</text><text x="762" y="649" font-size="19" fill="#243747" font-weight="400">図の幅・高さ・間隔は説明用。固定比率ではない。</text><text x="44" y="727" font-size="21" fill="#243747" font-weight="700">共通条件：曲げ・相対的なねじれがない配置を、同じ平行投影で示す。</text><text x="44" y="766" font-size="19" fill="#243747" font-weight="400">色は説明用。二方法の箱の範囲・角・寸法は同一視できない。出典と省略は README.md を参照。</text></g></svg>