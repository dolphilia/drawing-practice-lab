<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<title id="title">洞田式の補助箱：下側を変える二つの操作</title><desc id="desc">各段階を同じ視点・縮尺で比較 ｜ 上面を保ったまま底面の幅と前後位置を変える</desc>
<rect width="100%" height="100%" fill="#f6f8fa"/>
<g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif">
<text x="44" y="54" font-size="32" fill="#243747" font-weight="700">洞田式の補助箱：下側を変える二つの操作</text><text x="44" y="90" font-size="19" fill="#243747" font-weight="400">各段階を同じ視点・縮尺で比較 ｜ 上面を保ったまま底面の幅と前後位置を変える</text>
<rect x="24" y="122" width="448" height="525" rx="16" fill="white" stroke="#dce3e9"/><text x="46" y="165" font-size="23" fill="#243747" font-weight="700">1  補助箱を下へ延長</text><polyline points="193.39,495.51 357.94,520.10" fill="none" stroke="#91651b" stroke-width="1.6" stroke-dasharray="5 5"/><polyline points="193.39,495.51 130.06,523.90" fill="none" stroke="#91651b" stroke-width="1.6" stroke-dasharray="5 5"/><polyline points="193.39,495.51 193.39,357.87" fill="none" stroke="#91651b" stroke-width="1.6" stroke-dasharray="5 5"/><polygon points="357.94,520.10 294.61,548.49 294.61,410.85 357.94,382.45" fill="#e8c784" fill-opacity="0.9" stroke="#91651b" stroke-width="2.5" stroke-linejoin="round"/><polygon points="130.06,523.90 294.61,548.49 294.61,410.85 130.06,386.26" fill="#fff0cd" fill-opacity="0.9" stroke="#91651b" stroke-width="2.5" stroke-linejoin="round"/><polygon points="193.39,357.87 357.94,382.45 294.61,410.85 130.06,386.26" fill="#fff7e5" fill-opacity="0.9" stroke="#91651b" stroke-width="2.5" stroke-linejoin="round"/><polyline points="193.39,357.87 357.94,382.45" fill="none" stroke="#245b82" stroke-width="1.6" stroke-dasharray="5 5"/><polyline points="193.39,357.87 130.06,386.26" fill="none" stroke="#245b82" stroke-width="1.6" stroke-dasharray="5 5"/><polyline points="193.39,357.87 193.39,174.34" fill="none" stroke="#245b82" stroke-width="1.6" stroke-dasharray="5 5"/><polygon points="357.94,382.45 294.61,410.85 294.61,227.32 357.94,198.93" fill="#b8d6ed" fill-opacity="0.9" stroke="#245b82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="130.06,386.26 294.61,410.85 294.61,227.32 130.06,202.73" fill="#e2effa" fill-opacity="0.9" stroke="#245b82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="193.39,174.34 357.94,198.93 294.61,227.32 130.06,202.73" fill="#f2f8fc" fill-opacity="0.9" stroke="#245b82" stroke-width="2.5" stroke-linejoin="round"/><text x="46" y="586" font-size="20" fill="#243747" font-weight="400">高さは胸の基準箱の 3/4。</text><text x="46" y="619" font-size="20" fill="#243747" font-weight="400">下箱は構築の補助。</text><rect x="496" y="122" width="448" height="525" rx="16" fill="white" stroke="#dce3e9"/><text x="518" y="165" font-size="23" fill="#243747" font-weight="700">2  底面だけ幅を広げる</text><polyline points="637.97,491.41 857.36,524.20" fill="none" stroke="#91651b" stroke-width="1.6" stroke-dasharray="5 5"/><polyline points="637.97,491.41 574.64,519.80" fill="none" stroke="#91651b" stroke-width="1.6" stroke-dasharray="5 5"/><polyline points="637.97,491.41 665.39,357.87" fill="none" stroke="#91651b" stroke-width="1.6" stroke-dasharray="5 5"/><polygon points="857.36,524.20 794.03,552.59 766.61,410.85 829.94,382.45" fill="#e8c784" fill-opacity="0.9" stroke="#91651b" stroke-width="2.5" stroke-linejoin="round"/><polygon points="574.64,519.80 794.03,552.59 766.61,410.85 602.06,386.26" fill="#fff0cd" fill-opacity="0.9" stroke="#91651b" stroke-width="2.5" stroke-linejoin="round"/><polygon points="665.39,357.87 829.94,382.45 766.61,410.85 602.06,386.26" fill="#fff7e5" fill-opacity="0.9" stroke="#91651b" stroke-width="2.5" stroke-linejoin="round"/><polyline points="665.39,357.87 829.94,382.45" fill="none" stroke="#245b82" stroke-width="1.6" stroke-dasharray="5 5"/><polyline points="665.39,357.87 602.06,386.26" fill="none" stroke="#245b82" stroke-width="1.6" stroke-dasharray="5 5"/><polyline points="665.39,357.87 665.39,174.34" fill="none" stroke="#245b82" stroke-width="1.6" stroke-dasharray="5 5"/><polygon points="829.94,382.45 766.61,410.85 766.61,227.32 829.94,198.93" fill="#b8d6ed" fill-opacity="0.9" stroke="#245b82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="602.06,386.26 766.61,410.85 766.61,227.32 602.06,202.73" fill="#e2effa" fill-opacity="0.9" stroke="#245b82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="665.39,174.34 829.94,198.93 766.61,227.32 602.06,202.73" fill="#f2f8fc" fill-opacity="0.9" stroke="#245b82" stroke-width="2.5" stroke-linejoin="round"/><text x="518" y="586" font-size="20" fill="#243747" font-weight="400">底面を二分し、二つの正方形へ。</text><text x="518" y="619" font-size="20" fill="#243747" font-weight="400">上面の幅はそのまま。</text><rect x="968" y="122" width="448" height="525" rx="16" fill="white" stroke="#dce3e9"/><text x="990" y="165" font-size="23" fill="#243747" font-weight="700">3  底面だけ後ろへずらす</text><polyline points="1125.80,484.31 1345.20,517.10" fill="none" stroke="#91651b" stroke-width="1.6" stroke-dasharray="5 5"/><polyline points="1125.80,484.31 1062.47,512.71" fill="none" stroke="#91651b" stroke-width="1.6" stroke-dasharray="5 5"/><polyline points="1125.80,484.31 1137.39,357.87" fill="none" stroke="#91651b" stroke-width="1.6" stroke-dasharray="5 5"/><polygon points="1345.20,517.10 1281.86,545.49 1238.61,410.85 1301.94,382.45" fill="#e8c784" fill-opacity="0.9" stroke="#91651b" stroke-width="2.5" stroke-linejoin="round"/><polygon points="1062.47,512.71 1281.86,545.49 1238.61,410.85 1074.06,386.26" fill="#fff0cd" fill-opacity="0.9" stroke="#91651b" stroke-width="2.5" stroke-linejoin="round"/><polygon points="1137.39,357.87 1301.94,382.45 1238.61,410.85 1074.06,386.26" fill="#fff7e5" fill-opacity="0.9" stroke="#91651b" stroke-width="2.5" stroke-linejoin="round"/><polyline points="1137.39,357.87 1301.94,382.45" fill="none" stroke="#245b82" stroke-width="1.6" stroke-dasharray="5 5"/><polyline points="1137.39,357.87 1074.06,386.26" fill="none" stroke="#245b82" stroke-width="1.6" stroke-dasharray="5 5"/><polyline points="1137.39,357.87 1137.39,174.34" fill="none" stroke="#245b82" stroke-width="1.6" stroke-dasharray="5 5"/><polygon points="1301.94,382.45 1238.61,410.85 1238.61,227.32 1301.94,198.93" fill="#b8d6ed" fill-opacity="0.9" stroke="#245b82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="1074.06,386.26 1238.61,410.85 1238.61,227.32 1074.06,202.73" fill="#e2effa" fill-opacity="0.9" stroke="#245b82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="1137.39,174.34 1301.94,198.93 1238.61,227.32 1074.06,202.73" fill="#f2f8fc" fill-opacity="0.9" stroke="#245b82" stroke-width="2.5" stroke-linejoin="round"/><text x="990" y="586" font-size="20" fill="#243747" font-weight="400">ずらす量は奥行きの 1/4。</text><text x="990" y="619" font-size="20" fill="#243747" font-weight="400">箱全体の平行移動ではない。</text><text x="44" y="700" font-size="21" fill="#243747" font-weight="700">抜粋した操作：胸郭の面取り・股関節の球・骨盤の輪郭・くびれの構築は省略。</text><text x="44" y="740" font-size="19" fill="#243747" font-weight="400">原典第3回の「補助箱4 → 骨盤5 → 骨盤6」に対応。幅と移動を見分けるための独自の段階図。</text><text x="44" y="775" font-size="19" fill="#243747" font-weight="400">破線は隠れる辺を示す作図用の約束。人体の筋肉や皮膚の線ではありません。</text></g></svg>