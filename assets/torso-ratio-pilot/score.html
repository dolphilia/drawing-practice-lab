<!doctype html><html lang="ja"><meta charset="utf-8"><title>箱比率の6点採点 v1</title>
<style>body{font:16px system-ui;margin:24px}canvas{width:min(800px,calc(100vw - 60px));height:auto;border:1px solid #999}button,input,select{font:inherit;margin:8px}pre{white-space:pre-wrap}</style>
<h1>6点採点</h1><p>標準PNG（800×600）を選び、上辺左A・右B、接続辺左C・右D、下辺左E・右Fの順で、最終輪郭の線の中心をクリック。補助線ではなく交点を取ります。曖昧なら欠測です。</p>
<input id="file" type="file" accept="image/png"><label>採点回<input id="round" type="number" min="1" max="2" value="1"></label>
<select id="missing"><option value="">有効</option><option>ambiguous-contour</option><option>missing-edge</option><option>nonpositive-height</option><option>condition-violation</option><option>other</option></select><label>備考<input id="note"></label>
<button id="reset">点を選び直す</button><button id="export">CSV保存</button><p id="next">画像未読込</p><canvas id="image" width="800" height="600"></canvas><pre id="result"></pre>
<script src="measurement.js"></script><script>
const canvas=document.getElementById('image'),ctx=canvas.getContext('2d');let bitmap=null,filename='',points=[];
function render(){ctx.clearRect(0,0,800,600);if(bitmap)ctx.drawImage(bitmap,0,0);ctx.fillStyle='red';points.forEach((p,i)=>{ctx.beginPath();ctx.arc(...p,4,0,Math.PI*2);ctx.fill();ctx.fillText('ABCDEF'[i],p[0]+6,p[1]-6);});document.getElementById('next').textContent=points.length<6?'次の点：'+'ABCDEF'[points.length]:'6点選択済み';document.getElementById('result').textContent='';if(points.length===6){try{document.getElementById('result').textContent=JSON.stringify(measureRatio(points),null,2);}catch(e){document.getElementById('result').textContent=e.message;}}}
document.getElementById('file').onchange=e=>{let file=e.target.files[0];if(!file)return;let url=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(url);if(im.naturalWidth!==800||im.naturalHeight!==600){alert('800×600 PNGのみ使用可');return;}bitmap=im;filename=file.name;points=[];document.getElementById('missing').value='';document.getElementById('note').value='';render();};im.onerror=()=>{URL.revokeObjectURL(url);alert('画像を読み込めません');};im.src=url;};
canvas.onclick=e=>{if(!bitmap||points.length===6)return;let r=canvas.getBoundingClientRect();points.push([(e.clientX-r.left)*800/r.width,(e.clientY-r.top)*600/r.height]);render();};
document.getElementById('reset').onclick=()=>{points=[];render();};
document.getElementById('export').onclick=()=>{if(!bitmap)return;let reason=document.getElementById('missing').value,round=document.getElementById('round').value;if(!['1','2'].includes(round)){alert('採点回は1か2');return;}let m={};if(!reason){try{m=measureRatio(points);}catch(e){alert(e.message);return;}}let fields=['image','round','missing_reason','note',...Array.from('ABCDEF').flatMap(x=>[x+'_x',x+'_y']),'upper','lower','ratio','signed_error','absolute_error'];let values=[filename,round,reason,document.getElementById('note').value,...Array.from({length:6},(_,i)=>reason?['','']:(points[i]||['',''])).flat(),m.upper??'',m.lower??'',m.ratio??'',m.signed_error??'',m.absolute_error??''];let quote=x=>'"'+String(x).replaceAll('"','""')+'"';let url=URL.createObjectURL(new Blob([fields.map(quote).join(',')+'\n'+values.map(quote).join(',')+'\n'],{type:'text/csv;charset=utf-8'}));let link=document.createElement('a');link.href=url;link.download=filename.replace(/\.png$/i,'')+'-rating'+round+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></html>
