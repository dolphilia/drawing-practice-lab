<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><title>描く操作を分ける：量・向き・厚み</title><rect width="1400" height="780" fill="#f5f8fa"/><g font-family="Hiragino Sans, sans-serif"><text x="36" y="49" font-size="32" fill="#263a48">描く操作を分ける：量・向き・厚み</text><text x="36" y="89" font-size="20" fill="#263a48">概念比較用の独自模式図 ｜ 身体部位への対応と原典の確認範囲は本文を参照</text><rect x="25" y="123" width="430" height="542" rx="15" fill="white" stroke="#d5dfe5"/><text x="45" y="165" font-size="25" fill="#263a48">1  主要な量を置く</text><rect x="485" y="123" width="430" height="542" rx="15" fill="white" stroke="#d5dfe5"/><text x="505" y="165" font-size="25" fill="#263a48">2  面と軸で向きを示す</text><rect x="945" y="123" width="430" height="542" rx="15" fill="white" stroke="#d5dfe5"/><text x="965" y="165" font-size="25" fill="#263a48">3  断面で厚みを示す</text><polygon points="197.47,273.83 141.22,303.93 276.53,328.07 332.78,297.97" fill="#c6deee" stroke="#38546a" stroke-width="2"/><polygon points="332.78,500.07 332.78,297.97 276.53,328.07 276.53,530.17" fill="#c6deee" stroke="#38546a" stroke-width="2"/><polygon points="141.22,506.03 276.53,530.17 276.53,328.07 141.22,303.93" fill="#c6deee" stroke="#38546a" stroke-width="2"/><text x="48" y="572" font-size="21" fill="#263a48">外側にまとまりを与える。</text><text x="48" y="608" font-size="19" fill="#263a48">内部の骨・筋はまだ決まらない。</text><polygon points="657.47,273.83 601.22,303.93 736.53,328.07 792.78,297.97" fill="#c6deee" stroke="#38546a" stroke-width="2"/><polygon points="792.78,500.07 792.78,297.97 736.53,328.07 736.53,530.17" fill="#c6deee" stroke="#38546a" stroke-width="2"/><polygon points="601.22,506.03 736.53,530.17 736.53,328.07 601.22,303.93" fill="#c6deee" stroke="#38546a" stroke-width="2"/><line x1="697.0" y1="402.0" x2="794.4278579257493" y2="419.3822059335908" stroke="#a34343" stroke-width="3"/><text x="801.4278579257493" y="411.3822059335908" font-size="20" fill="#a34343">x</text><line x1="697.0" y1="402.0" x2="697.0" y2="268.8520877186785" stroke="#29806e" stroke-width="3"/><text x="704.0" y="260.8520877186785" font-size="20" fill="#29806e">y</text><line x1="697.0" y1="402.0" x2="643.875" y2="430.4342602787931" stroke="#545bb1" stroke-width="3"/><text x="650.875" y="422.4342602787931" font-size="20" fill="#545bb1">z</text><text x="508" y="572" font-size="21" fill="#263a48">軸は方向、面は見える側を示す。</text><text x="508" y="608" font-size="19" fill="#263a48">赤・緑・紫は独自の座標表示。</text><polygon points="1232.00,300.95 1231.36,303.98 1231.36,506.07 1232.00,503.05" fill="#f1d7a6" stroke="#38546a" stroke-width="2"/><polygon points="1082.64,303.98 1082.00,300.95 1082.00,503.05 1082.64,506.07" fill="#f1d7a6" stroke="#38546a" stroke-width="2"/><polygon points="1231.36,303.98 1229.44,306.95 1229.44,509.05 1231.36,506.07" fill="#f1d7a6" stroke="#38546a" stroke-width="2"/><polygon points="1084.56,306.95 1082.64,303.98 1082.64,506.07 1084.56,509.05" fill="#f1d7a6" stroke="#38546a" stroke-width="2"/><polygon points="1229.44,306.95 1226.29,309.82 1226.29,511.92 1229.44,509.05" fill="#f1d7a6" stroke="#38546a" stroke-width="2"/><polygon points="1087.71,309.82 1084.56,306.95 1084.56,509.05 1087.71,511.92" fill="#f1d7a6" stroke="#38546a" stroke-width="2"/><polygon points="1226.29,309.82 1221.95,312.54 1221.95,514.64 1226.29,511.92" fill="#f1d7a6" stroke="#38546a" stroke-width="2"/><polygon points="1092.05,312.54 1087.71,309.82 1087.71,511.92 1092.05,514.64" fill="#f1d7a6" stroke="#38546a" stroke-width="2"/><polygon points="1226.29,309.82 1229.44,306.95 1231.36,303.98 1232.00,300.95 1231.36,297.93 1229.44,294.95 1226.29,292.08 1221.95,289.36 1216.50,286.84 1210.03,284.56 1202.66,282.56 1194.50,280.88 1185.70,279.54 1176.41,278.56 1166.79,277.97 1157.00,277.77 1147.21,277.97 1137.59,278.56 1128.30,279.54 1119.50,280.88 1111.34,282.56 1103.97,284.56 1097.50,286.84 1092.05,289.36 1087.71,292.08 1084.56,294.95 1082.64,297.93 1082.00,300.95 1082.64,303.98 1084.56,306.95 1087.71,309.82 1092.05,312.54 1097.50,315.06 1103.97,317.34 1111.34,319.34 1119.50,32