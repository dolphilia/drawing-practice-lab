/text><text x="968" y="608" font-size="19" fill="#263a48">裏側も表示する透視的な約束。</text><text x="36" y="707" font-size="24" fill="#263a48">同じ情報ではない：量の配置 → 部品の向き → 曲面の回り込み。</text><text x="36" y="750" font-size="19" fill="#263a48">箱・円柱・寸法・投影は独自設計。リクノ固有理論の再現図、人体の正解像ではありません。</text></g></svg>