<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><title>向きを変えることと、つなぐことを分ける</title><rect width="1400" height="780" fill="#f5f8fa"/><g font-family="Hiragino Sans, sans-serif"><text x="36" y="49" font-size="32" fill="#263a48">向きを変えることと、つなぐことを分ける</text><text x="36" y="89" font-size="20" fill="#263a48">Bridgman・洞田・Prokoの比較で使う概念を、任意の幾何学形で説明</text><rect x="25" y="123" width="430" height="542" rx="15" fill="white" stroke="#d5dfe5"/><text x="45" y="165" font-size="25" fill="#263a48">1  同じ向きの二つの量</text><rect x="485" y="123" width="430" height="542" rx="15" fill="white" stroke="#d5dfe5"/><text x="505" y="165" font-size="25" fill="#263a48">2  下側の向きを変える</text><rect x="945" y="123" width="430" height="542" rx="15" fill="white" stroke="#d5dfe5"/><text x="965" y="165" font-size="25" fill="#263a48">3  対応点をつなぐ</text><polygon points="196.05,422.66 148.05,448.35 277.95,471.52 325.95,445.83" fill="#f1d7a6" stroke="#38546a" stroke-width="2"/><polygon points="325.95,520.02 325.95,445.83 277.95,471.52 277.95,545.71" fill="#f1d7a6" stroke="#38546a" stroke-width="2"/><polygon points="148.05,522.53 277.95,545.71 277.95,471.52 148.05,448.35" fill="#f1d7a6" stroke="#38546a" stroke-width="2"/><polygon points="199.74,270.32 154.74,294.40 274.26,315.72 319.26,291.64" fill="#c6deee" stroke="#38546a" stroke-width="2"/><polygon points="319.26,365.82 319.26,291.64 274.26,315.72 274.26,389.91" fill="#c6deee" stroke="#38546a" stroke-width="2"/><polygon points="154.74,368.58 274.26,389.91 274.26,315.72 154.74,294.40" fill="#c6deee" stroke="#38546a" stroke-width="2"/><text x="48" y="572" font-size="20" fill="#263a48">向きがそろっていても、</text><text x="48" y="608" font-size="18" fill="#263a48">間の形は自動的に決まらない。</text><polygon points="618.10,508.52 626.47,538.07 626.47,463.89 618.10,434.33" fill="#f1d7a6" stroke="#38546a" stroke-width="2"/><polygon points="618.10,434.33 626.47,463.89 775.90,459.85 767.53,430.29" fill="#f1d7a6" stroke="#38546a" stroke-width="2"/><polygon points="626.47,538.07 775.90,534.03 775.90,459.85 626.47,463.89" fill="#f1d7a6" stroke="#38546a" stroke-width="2"/><polygon points="659.74,270.32 614.74,294.40 734.26,315.72 779.26,291.64" fill="#c6deee" stroke="#38546a" stroke-width="2"/><polygon points="779.26,365.82 779.26,291.64 734.26,315.72 734.26,389.91" fill="#c6deee" stroke="#38546a" stroke-width="2"/><polygon points="614.74,368.58 734.26,389.91 734.26,315.72 614.74,294.40" fill="#c6deee" stroke="#38546a" stroke-width="2"/><text x="508" y="572" font-size="20" fill="#263a48">この図では y 軸まわりに 35°。</text><text x="508" y="608" font-size="18" fill="#263a48">数値は説明用。人体の可動域ではない。</text><polygon points="1078.10,508.52 1086.47,538.07 1086.47,463.89 1078.10,434.33" fill="#f1d7a6" stroke="#38546a" stroke-width="2"/><polygon points="1078.10,434.33 1086.47,463.89 1235.90,459.85 1227.53,430.29" fill="#f1d7a6" stroke="#38546a" stroke-width="2"/><polygon points="1086.47,538.07 1235.90,534.03 1235.90,459.85 1086.47,463.89" fill="#f1d7a6" stroke="#38546a" stroke-width="2"/><polygon points="1119.74,270.32 1074.74,294.40 1194.26,315.72 1239.26,291.64" fill="#c6deee" stroke="#38546a" stroke-width="2"/><polygon points="1239.26,365.82 1239.26,291.64 1194.26,315.72 1194.26,389.91" fill="#c6deee" stroke="#38546a" stroke-width="2"/><polygon points="1074.74,368.58 1194.26,389.91 1194.26,315.72 1074.74,294.40" fill="#c6deee" stroke="#38546a" stroke-width="2"/><polygon points="1074.74,368.58 1194.26,389.91 1235.90,459.85 1086.47,463.89" fill="#e4eeed" stroke="#29806e" stroke-width="2"/><circle cx="1074.7442471388738" cy="368.5841159906242" r="5" fill="#a34343"/><circle cx="1086.4688732950067" cy="463.8875219484861" r="5" fill="#a34343"/><circle cx="1194.2557528611262" cy="389.9062886024956" r="5" fill="#a34343"/><circle cx="1235.8980780087686" cy="459.8476310985265" r="5" fill="#a34343"/><text x="968" y="572" font-size="20" fill="#263a48">赤点は仮の対応点、緑は接続帯。</text><text x="968" y="608" font-size="18" fill="#263a48">骨の目印や筋の付着位置ではない。</text><text x="36" y="707" font-size="24" fill="#263a48">回転の指定と、隙間をどうつなぐかは別の判断。</text><text x="36" y="750" font-size="20" fill="#263a48">接続帯は独自の可視化。皮膚・筋・腹斜筋の形、原典の描線順を表していません。</text></g></svg>