<svg xmlns="http://www.w3.org/2000/svg" width="960" height="395" viewBox="0 0 960 395"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#178178"/></marker></defs><g font-family="Hiragino Kaku Gothic ProN, sans-serif" fill="#23465a"><text x="20" y="32" font-size="23" fill="#23465a">上から見た断面：左右Xと奥行きZの関係</text><line x1="75" y1="285" x2="885" y2="285" stroke="#178178" stroke-width="2" marker-end="url(#arrow)"/><text x="865" y="321" font-size="19" fill="#23465a">前 Z</text><line x1="100" y1="312" x2="100" y2="66" stroke="#178178" stroke-width="2" marker-end="url(#arrow)"/><text x="22" y="68" font-size="19" fill="#23465a">右 X</text><line x1="355" y1="75" x2="355" y2="315" stroke="#bf652e" stroke-width="4"/><text x="282" y="60" font-size="20" fill="#bf652e">画面 Z = f</text><line x1="100" y1="285" x2="780" y2="90" stroke="#23465a" stroke-width="3"/><line x1="780" y1="90" x2="780" y2="285" stroke="#72858d" stroke-width="2" stroke-dasharray="7 5"/><line x1="355" y1="211.875" x2="355" y2="285" stroke="#178178" stroke-width="4"/><circle cx="100" cy="285" r="5" fill="#bf652e"/><circle cx="780" cy="90" r="5" fill="#bf652e"/><circle cx="355" cy="211.875" r="5" fill="#bf652e"/><text x="51" y="351" font-size="19" fill="#23465a">視点 O</text><text x="672" y="69" font-size="19" fill="#23465a">立体の点 (X, Z)</text><text x="369" y="176" font-size="19" fill="#23465a">紙に写る点</text><text x="368" y="254" font-size="19" fill="#23465a">u</text><text x="793" y="187" font-size="19" fill="#23465a">X</text><text x="195" y="318" font-size="19" fill="#23465a">f</text><text x="445" y="353" font-size="19" fill="#23465a">Z：視点から点までの前方向の距離</text><text x="420" y="382" font-size="21" fill="#23465a">同じ視線上なので u / f = X / Z</text></g></svg>