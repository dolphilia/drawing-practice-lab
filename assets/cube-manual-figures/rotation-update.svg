<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#178178"/></marker></defs><g font-family="Hiragino Kaku Gothic ProN, sans-serif" fill="#23465a"><text x="45" y="32" font-size="21" fill="#23465a">① 元の2成分を書く</text><text x="345" y="32" font-size="21" fill="#23465a">② 新しい値を両方計算</text><text x="678" y="32" font-size="21" fill="#23465a">③ 両方を置き換える</text><rect x="35" y="60" width="264" height="241" rx="8" fill="#f0f6f6"/><rect x="342" y="60" width="264" height="241" rx="8" fill="#f0f6f6"/><rect x="666" y="60" width="264" height="241" rx="8" fill="#f0f6f6"/><text x="55" y="112" font-size="24" fill="#23465a">h1 = (30, 0, 0)</text><text x="55" y="163" font-size="23" fill="#23465a">元X = 30</text><text x="55" y="206" font-size="23" fill="#23465a">元Z = 0</text><text x="55" y="260" font-size="19" fill="#23465a">Y = 0 は変えない</text><text x="359" y="110" font-size="18" fill="#23465a">新X = cα × 30 + sα × 0</text><text x="359" y="153" font-size="20" fill="#23465a">       = 26.0625</text><text x="359" y="214" font-size="18" fill="#23465a">新Z = −sα × 30 + cα × 0</text><text x="359" y="257" font-size="20" fill="#23465a">       = −15</text><text x="686" y="118" font-size="23" fill="#23465a">h1 ≈</text><text x="686" y="161" font-size="22" fill="#23465a">(26.062, 0, −15)</text><text x="686" y="230" font-size="19" fill="#23465a">次のβの回転では</text><text x="686" y="263" font-size="19" fill="#23465a">この結果を元にする。</text><line x1="302" y1="182" x2="334" y2="182" stroke="#178178" stroke-width="2" marker-end="url(#arrow)"/><line x1="610" y1="182" x2="656" y2="182" stroke="#178178" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="347" font-size="20" fill="#23465a">α = 30°、cα = 0.86875、sα = 0.5 の例。途中の26.0625を新Zの式へ入れない。</text></g></svg>