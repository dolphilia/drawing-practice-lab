nt-size="18" fill="#23465a">端点</text><circle cx="795" cy="305.0" r="5" fill="#bf652e"/><text x="805" y="314.0" font-size="18" fill="#23465a">交点</text><text x="751" y="192" font-size="18" fill="#23465a">45</text><text x="800" y="110" font-size="18" fill="#bf652e">画面50</text><text x="545" y="357" font-size="18" fill="#23465a">交点の読み −30 を 1/2 で割る</text><text x="545" y="389" font-size="22" fill="#23465a">v = −60mm</text><text x="25" y="423" font-size="16" fill="#72858d">説明用の模式図。左右の図の縦方向は別の表示倍率です。実際は各補助図内で全値を同率に縮めます。</text></g></svg>