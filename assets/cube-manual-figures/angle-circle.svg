<svg xmlns="http://www.w3.org/2000/svg" width="960" height="435" viewBox="0 0 960 435"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#178178"/></marker></defs><g font-family="Hiragino Kaku Gothic ProN, sans-serif" fill="#23465a"><circle cx="300" cy="235" r="155" fill="none" stroke="#a4c5ca" stroke-width="2"/><line x1="95" y1="235" x2="495" y2="235" stroke="#178178" stroke-width="2" marker-end="url(#arrow)"/><line x1="300" y1="420" x2="300" y2="42" stroke="#178178" stroke-width="2" marker-end="url(#arrow)"/><line x1="300" y1="235" x2="434.233937586588" y2="157.5" stroke="#23465a" stroke-width="3"/><line x1="434.233937586588" y1="157.5" x2="434.233937586588" y2="235" stroke="#bf652e" stroke-width="3"/><line x1="434.233937586588" y1="157.5" x2="300" y2="157.5" stroke="#72858d" stroke-width="2" stroke-dasharray="7 5"/><circle cx="434.233937586588" cy="157.5" r="5" fill="#bf652e"/><circle cx="300" cy="235" r="5" fill="#bf652e"/><text x="496" y="242" font-size="19" fill="#23465a">横</text><text x="309" y="43" font-size="19" fill="#23465a">縦</text><text x="313" y="219" font-size="18" fill="#23465a">30°</text><text x="348" y="272" font-size="18" fill="#23465a">横 約69.5mm</text><text x="443" y="192" font-size="18" fill="#23465a">縦40mm</text><text x="535" y="102" font-size="24" fill="#23465a">半径80mmの円</text><text x="535" y="151" font-size="22" fill="#23465a">横を80で割る → c</text><text x="535" y="188" font-size="22" fill="#23465a">縦を80で割る → s</text><text x="535" y="245" font-size="19" fill="#23465a">c = 69.5 ÷ 80 = 0.86875</text><text x="535" y="281" font-size="19" fill="#23465a">s = 40 ÷ 80 = 0.5</text><text x="535" y="342" font-size="19" fill="#23465a">左・下は負の値として読む。</text><text x="535" y="375" font-size="17" fill="#72858d">図は模式図。長さは記載値を使う。</text></g></svg>