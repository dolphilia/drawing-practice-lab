<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#178178"/></marker></defs><g font-family="Hiragino Kaku Gothic ProN, sans-serif" fill="#23465a"><line x1="235" y1="215" x2="105" y2="315" stroke="#bdcdd2" stroke-width="2"/><line x1="235" y1="215" x2="235" y2="35" stroke="#bdcdd2" stroke-width="2"/><line x1="235" y1="215" x2="425" y2="275" stroke="#bdcdd2" stroke-width="2"/><line x1="105" y1="315" x2="105" y2="135" stroke="#bdcdd2" stroke-width="2"/><line x1="105" y1="315" x2="295" y2="375" stroke="#bdcdd2" stroke-width="2"/><line x1="235" y1="35" x2="105" y2="135" stroke="#bdcdd2" stroke-width="2"/><line x1="235" y1="35" x2="425" y2="95" stroke="#bdcdd2" stroke-width="2"/><line x1="105" y1="135" x2="295" y2="195" stroke="#bdcdd2" stroke-width="2"/><line x1="425" y1="275" x2="295" y2="375" stroke="#bdcdd2" stroke-width="2"/><line x1="425" y1="275" x2="425" y2="95" stroke="#bdcdd2" stroke-width="2"/><line x1="295" y1="375" x2="295" y2="195" stroke="#bdcdd2" stroke-width="2"/><line x1="425" y1="95" x2="295" y2="195" stroke="#bdcdd2" stroke-width="2"/><line x1="265" y1="205" x2="360" y2="235" stroke="#178178" stroke-width="4" marker-end="url(#arrow)"/><text x="365" y="250" font-size="23" fill="#23465a">h1</text><line x1="265" y1="205" x2="265" y2="115" stroke="#178178" stroke-width="4" marker-end="url(#arrow)"/><text x="277" y="115" font-size="23" fill="#23465a">h2</text><line x1="265" y1="205" x2="200" y2="255" stroke="#178178" stroke-width="4" marker-end="url(#arrow)"/><text x="167" y="263" font-size="23" fill="#23465a">h3</text><circle cx="265" cy="205" r="5" fill="#bf652e"/><text x="236" y="193" font-size="23" fill="#23465a">C</text><line x1="265" y1="205" x2="360" y2="235" stroke="#bf652e" stroke-width="3" stroke-dasharray="7 5"/><line x1="360" y1="235" x2="360" y2="145" stroke="#bf652e" stroke-width="3" stroke-dasharray="7 5"/><line x1="360" y1="145" x2="295" y2="195" stroke="#bf652e" stroke-width="3" stroke-dasharray="7 5"/><circle cx="295" cy="195" r="5" fill="#bf652e"/><text x="309" y="188" font-size="23" fill="#bf652e">P7</text><text x="525" y="70" font-size="23" fill="#23465a">半辺は「半分の辺長の矢印」</text><text x="525" y="121" font-size="19" fill="#23465a">例：一辺60mmなら、各矢印は30mm。</text><text x="525" y="177" font-size="20" fill="#23465a">3本とも、出発点は中心C。</text><text x="525" y="218" font-size="20" fill="#23465a">矢印1本の先は面の中心です。</text><text x="525" y="281" font-size="23" fill="#bf652e">P7 = C + h1 + h2 + h3</text><text x="525" y="323" font-size="19" fill="#23465a">矢印を平行移動して順につなぐと、</text><text x="525" y="355" font-size="19" fill="#23465a">3本ぶん進んだ先が立方体の頂点。</text><text x="40" y="411" font-size="17" fill="#23465a">緑：中心からの3本の半辺　／　橙の破線：P7まで足し合わせる経路（模式図）</text></g></svg>