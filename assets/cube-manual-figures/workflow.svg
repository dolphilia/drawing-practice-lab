<svg xmlns="http://www.w3.org/2000/svg" width="960" height="255" viewBox="0 0 960 255"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#178178"/></marker></defs><g font-family="Hiragino Kaku Gothic ProN, sans-serif" fill="#23465a"><rect x="12" y="55" width="173" height="110" rx="8" fill="#eef5f5" stroke="#b2d2d1"/><text x="26" y="91" font-size="22" fill="#23465a">① 入力</text><text x="22" y="132" font-size="16" fill="#23465a">位置・向き・大きさ</text><line x1="186" y1="108" x2="201" y2="108" stroke="#178178" stroke-width="2" marker-end="url(#arrow)"/><rect x="203" y="55" width="173" height="110" rx="8" fill="#eef5f5" stroke="#b2d2d1"/><text x="217" y="91" font-size="22" fill="#23465a">② 半辺</text><text x="213" y="132" font-size="16" fill="#23465a">3本の矢印を回す</text><line x1="377" y1="108" x2="392" y2="108" stroke="#178178" stroke-width="2" marker-end="url(#arrow)"/><rect x="394" y="55" width="173" height="110" rx="8" fill="#eef5f5" stroke="#b2d2d1"/><text x="408" y="91" font-size="22" fill="#23465a">③ 頂点</text><text x="404" y="132" font-size="16" fill="#23465a">符号表で8点を作る</text><line x1="568" y1="108" x2="583" y2="108" stroke="#178178" stroke-width="2" marker-end="url(#arrow)"/><rect x="585" y="55" width="173" height="110" rx="8" fill="#eef5f5" stroke="#b2d2d1"/><text x="599" y="91" font-size="22" fill="#23465a">④ 投影</text><text x="595" y="132" font-size="16" fill="#23465a">奥行きZで割る</text><line x1="759" y1="108" x2="774" y2="108" stroke="#178178" stroke-width="2" marker-end="url(#arrow)"/><rect x="776" y="55" width="173" height="110" rx="8" fill="#eef5f5" stroke="#b2d2d1"/><text x="790" y="91" font-size="22" fill="#23465a">⑤ 描画</text><text x="786" y="132" font-size="16" fill="#23465a">紙に点を打ち結ぶ</text><text x="20" y="217" font-size="20" fill="#23465a">立体の座標 (X, Y, Z) を作る                  →                  紙の座標 (u, v) に変える</text></g></svg>